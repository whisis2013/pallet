/* Layout: warehouse tally board — pallet list rail on the left, selected pallet's side-view stack + layer sheets on the right; stacks to one column on phones */
:root{
  --bg:#EBEFF1; --panel:#FFFFFF; --sunk:#F4F6F7; --ink:#14212B; --muted:#58656F; --line:#D2D9DE;
  --accent:#0E59BA; --accent-ink:#FFFFFF; --accent-soft:#DCE8F8;
  --wood:#B07F50; --wood-dark:#7C5634;
  --ok:#1D7A4B; --ok-soft:#DCEFE4; --warn:#9A5A00; --warn-soft:#F7E9D2; --done:#5B6670; --done-soft:#E3E7EA;
  --hit:#FFE58A; --danger:#B3261E;
  --p1:#4C79A8; --p2:#C0733F; --p3:#4E9775; --p4:#A0588A; --p5:#A88C26; --p6:#5966B3; --p7:#6F8391; --p8:#BC4F4F; --on-p:#FFFFFF;
  --f-body:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E151A; --panel:#162028; --sunk:#111A20; --ink:#E4EAEE; --muted:#93A2AD; --line:#2A3843;
  --accent:#6AA5F2; --accent-ink:#0B1520; --accent-soft:#1B3350;
  --wood:#8C6540; --wood-dark:#5E4129;
  --ok:#6BCB98; --ok-soft:#173528; --warn:#E8B062; --warn-soft:#3A2B14; --done:#A3AEB7; --done-soft:#242F37;
  --hit:#6B5A12; --danger:#F08A82;
  --p1:#8AB2DD; --p2:#E6A273; --p3:#86C9A8; --p4:#D394C0; --p5:#D9C063; --p6:#9AA5E8; --p7:#A9BAC6; --p8:#EB8D8D; --on-p:#0E151A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E151A; --panel:#162028; --sunk:#111A20; --ink:#E4EAEE; --muted:#93A2AD; --line:#2A3843;
  --accent:#6AA5F2; --accent-ink:#0B1520; --accent-soft:#1B3350;
  --wood:#8C6540; --wood-dark:#5E4129;
  --ok:#6BCB98; --ok-soft:#173528; --warn:#E8B062; --warn-soft:#3A2B14; --done:#A3AEB7; --done-soft:#242F37;
  --hit:#6B5A12; --danger:#F08A82;
  --p1:#8AB2DD; --p2:#E6A273; --p3:#86C9A8; --p4:#D394C0; --p5:#D9C063; --p6:#9AA5E8; --p7:#A9BAC6; --p8:#EB8D8D; --on-p:#0E151A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.code{font-variant-numeric:tabular-nums}
.code{font-family:var(--f-code);letter-spacing:.01em}

.top{background:var(--panel);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{padding-block:14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}

.bar{padding-block:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 280px;position:relative;min-width:0}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.notice p{margin:0;min-width:0}

.main{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:18px;align-items:start;padding-bottom:40px}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:inherit;text-decoration:none}
.pcard:hover{border-color:var(--muted)}
.pcard[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pcard .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .code{font-size:16px;font-weight:600}
.pcard .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.mini{display:flex;gap:2px;margin-top:9px;height:8px;border-radius:2px;overflow:hidden}
.mini span{display:block;height:100%}
.hits{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.hits li{background:var(--sunk);border-radius:4px;padding:4px 8px}
.hits b{font-weight:600}
.pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-packing{background:var(--warn-soft);color:var(--warn)}
.st-ready{background:var(--ok-soft);color:var(--ok)}
.st-shipped{background:var(--done-soft);color:var(--done)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted)}

.detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start}
.dhead .id{margin-right:auto;min-width:0}
.dhead .label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dhead h2{margin:2px 0 4px;font-family:var(--f-code);font-size:30px;font-weight:600;letter-spacing:.02em;line-height:1.15;word-break:break-all}
.dhead .sub{color:var(--muted)}
.dactions{display:flex;flex-wrap:wrap;gap:8px}
.back{display:none}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line)}
.stat{padding:12px 20px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat dt{font-size:12px;color:var(--muted)}
.stat dd{margin:2px 0 0;font-size:20px;font-weight:600}
.stat dd small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.dbody{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:22px;padding:20px}
.stackbox{min-width:0}
.stackbox h3,.sheets h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack svg{width:100%;height:auto;display:block}
.stack .lay{cursor:pointer}
.stack .lay:hover .band-o{stroke:var(--ink)}
.legend{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.legend li{display:flex;gap:8px;align-items:center;min-width:0}
.legend i{flex:0 0 12px;height:12px;border-radius:2px}
.legend span{min-width:0;overflow-wrap:anywhere}
.note{margin-top:14px;background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:13px;white-space:pre-wrap}
.sheets{min-width:0;display:flex;flex-direction:column;gap:14px}
.layer{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:16px}
.layer.flash{box-shadow:0 0 0 2px var(--accent)}
.layer header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.layer header b{font-size:14px}
.layer header span{color:var(--muted);font-size:12.5px}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;white-space:nowrap}
td.r,th.r{text-align:right}
td .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:baseline}
td .alt{display:block;color:var(--muted);font-size:12px}
.layer td:first-child{min-width:170px}
tr.hit td{background:var(--hit)}
tr.flash td{background:var(--accent-soft)}
.pcard .pname{font-size:13.5px;font-weight:500;margin-top:4px;overflow-wrap:anywhere}
.prod{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.prod.hit{background:var(--hit)}
.prod-h{display:flex;gap:10px;align-items:flex-start}
.prod-h .sw{flex:0 0 14px;height:14px;border-radius:3px;margin-top:4px}
.prod-h b{font-size:16px;font-weight:600}
.prod-h .alt{display:block;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:1px 0 0;font-size:14px;overflow-wrap:anywhere}
.calc{margin:0;padding:9px 12px;background:var(--accent-soft);border-radius:5px;font-weight:600}
.mode{align-self:flex-start}

.sheet-bg{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border-radius:10px;width:100%;max-width:980px;border:1px solid var(--line);margin-block:auto}
.sheet.narrow{max-width:520px}
.sheet > header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet > header h2{margin:0;font-size:17px}
.sheet .body{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.sheet footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.sheet footer .grow{display:flex;gap:8px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea,.ed input,.ed select{border:1px solid var(--line);background:var(--sunk);border-radius:5px;padding:8px 9px;color:var(--ink);font-size:14px;width:100%;min-width:0}
label.f textarea{min-height:64px;resize:vertical}
.ed-layer{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ed-layer > header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.ed{min-width:780px}
.ed th{padding:6px 6px}
.ed td{padding:5px 6px;border-bottom:1px solid var(--line)}
.ed input,.ed select{padding:6px 7px;font-size:13px}
.ed .w-n{width:28%}.ed .w-q{width:16%}.ed .w-s{width:15%}.ed .w-c{width:8%}.ed .w-l{width:11%}.ed .w-e{width:10%}
.x{border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:4px}
.x:hover{color:var(--danger);background:var(--sunk)}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.err{color:var(--danger);font-size:13px;margin:0}
.paste textarea{width:100%;min-height:180px;font-family:var(--f-code);font-size:12.5px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);padding:10px;white-space:pre;color:var(--ink)}
.colspec{display:flex;flex-wrap:wrap;gap:4px}
.colspec span{font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
.qrwrap{display:flex;justify-content:center;background:var(--sunk);border-radius:var(--r);padding:14px}
.qrtext{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-family:var(--f-body);font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow-y:auto}
.qrwrap img{max-width:100%;width:340px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 4px 18px rgba(0,0,0,.25)}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .main.has-sel .list{display:none}
  .main:not(.has-sel) .detail{display:none}
  .back{display:inline-flex}
  .dbody{grid-template-columns:minmax(0,1fr)}
  .stackbox{max-width:360px;width:100%;margin:0 auto}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat:nth-child(3){border-right:0}
  .stat:nth-child(n+4){border-top:1px solid var(--line)}
  .dhead h2{font-size:26px}
}
.viewer .bar,.viewer .list,.viewer .back,.viewer [data-act=qr]{display:none!important}
.viewer .main{grid-template-columns:minmax(0,1fr)!important;padding-top:16px}
.viewer .main:not(.has-sel) .detail{display:block!important}
.vnote{margin:16px 0 0;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

var state;
try{ state = JSON.parse(document.getElementById("state").textContent); }catch(e){ state = {example:false,pallets:[]}; }
if(!state.pallets) state.pallets = [];

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var ui = { lang: lsGet("pl-lang")==="vi"?"vi":"ko", ship:"all", q:"", sel:null, modal:null, draft:null, draftOrig:null, err:"", paste:"", pasteRes:null, flashLayer:null, busy:false };
var cap = { art:null, dl:null, canEdit:false, ready:false };
function t(){ return T[ui.lang]; }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function n0(x){ var v = Number(x); return isFinite(v)?v:0; }
function fmt(x){ return n0(x).toLocaleString(ui.lang==="vi"?"vi-VN":"ko-KR"); }
function iname(it){ return it.n||it.v||"—"; }
function specOf(it){ var q=String(it&&it.q!=null?it.q:"").trim(); return q? q+" "+(it.qu||"ml") : ""; }
function unitSel(id,val,attrs){ return '<select id="'+id+'" '+attrs+'>'+["ml","g"].map(function(u){ return '<option value="'+u+'"'+((val||"ml")===u?" selected":"")+'>'+u+'</option>'; }).join("")+'</select>'; }
function ialt(it){ return ""; }
function slug(s){ return String(s||"").trim().replace(/[^A-Za-z0-9-]+/g,"-").replace(/^-+|-+$/g,""); }
function findP(code){ for(var i=0;i<state.pallets.length;i++){ if(state.pallets[i].code===code) return state.pallets[i]; } return null; }
function findBySlug(sl){ for(var i=0;i<state.pallets.length;i++){ if(slug(state.pallets[i].code)===sl) return state.pallets[i]; } return null; }

var colorMap = {};
function pcolor(it){
  var key = (it.s||it.n||it.v||"?");
  if(colorMap[key]) return colorMap[key];
  var h=0; for(var i=0;i<key.length;i++){ h=(h*31+key.charCodeAt(i))>>>0; }
  colorMap[key] = "var(--p"+((h%8)+1)+")";
  return colorMap[key];
}
function isSingle(p){ return p.mode!=="mixed" && !!p.item; }
function remOf(p){ return isSingle(p)? Math.floor(n0(p.item.r)) : 0; }
function withC(item,c){ var o={}; for(var k in item) o[k]=item[k]; o.c=c; return o; }
function splitSingle(p){
  var per=Math.floor(n0(p.per)), tot=Math.floor(n0(p.total));
  if(per<=0) return {per:tot,full:tot?1:0,rem:0,tot:tot};
  return {per:per,full:Math.floor(tot/per),rem:tot%per,tot:tot};
}
function layersOf(p){
  if(!isSingle(p)) return p.layers||[];
  var sp=splitSingle(p), out=[];
  for(var i=0;i<sp.full;i++) out.push([withC(p.item,sp.per)]);
  if(sp.rem) out.push([withC(p.item,sp.rem)]);
  return out;
}
function totals(p){
  var c=0,u=0, ls=layersOf(p);
  ls.forEach(function(L){ L.forEach(function(it){ c+=n0(it.c); u+=n0(it.c)*n0(it.u); }); });
  var rr=remOf(p); if(rr){ c+=1; u+=rr; }
  return {c:c,u:u,l:ls.length,r:rr};
}
function productsOf(p){
  var m={}, out=[];
  layersOf(p).forEach(function(Ly){ Ly.forEach(function(it){ var k=(it.s||"")+"|"+(it.n||it.v)+"|"+(it.l||"")+"|"+(it.q||"")+(it.qu||""); if(!m[k]){ m[k]=withC(it,0); out.push(m[k]); } m[k].c+=n0(it.c); }); });
  return out;
}
function matches(it,q){
  if(!q) return false;
  var hay = [it.n,it.v,it.s,it.l].join(" ").toLowerCase();
  return hay.indexOf(q)>=0;
}

/* ---------- render ---------- */
var app = document.getElementById("app");
function render(){
  var L = t();
  document.documentElement.lang = ui.lang;
  var ships = []; state.pallets.forEach(function(p){ if(p.ship && ships.indexOf(p.ship)<0) ships.push(p.ship); });
  ships.sort();
  if(ui.ship!=="all" && ships.indexOf(ui.ship)<0) ui.ship="all";
  var q = ui.q.trim().toLowerCase();
  var list = state.pallets.filter(function(p){ return ui.ship==="all" || p.ship===ui.ship; });
  var rows = [];
  list.forEach(function(p){
    var hits=[];
    if(q){
      productsOf(p).forEach(function(it){ if(matches(it,q)) hits.push(it); });
      var codeHit = (p.code+" "+(p.ship||"")).toLowerCase().indexOf(q)>=0;
      if(!hits.length && !codeHit) return;
    }
    rows.push({p:p,hits:hits});
  });
  rows.sort(function(a,b){ return a.p.code<b.p.code?-1:a.p.code>b.p.code?1:0; });

  var sel = ui.sel ? findP(ui.sel) : null;
  if(ui.sel && !sel) ui.sel = null;

  var h = '';

  h += '<div class="seg" role="group" aria-label="Language"><button type="button" data-act="lang" data-v="ko" aria-pressed="'+(ui.lang==="ko")+'">한국어</button><button type="button" data-act="lang" data-v="vi" aria-pressed="'+(ui.lang==="vi")+'">Tiếng Việt</button></div>';

  }

  h += '<div class="wrap"><div class="bar"><div class="search">'+icon("search")+'<input id="q" type="search" autocomplete="off" placeholder="'+esc(L.search)+'" value="'+esc(ui.q)+'"></div>';
  if(ships.length>1){
    h += '<div class="chips"><button type="button" class="chip" data-act="ship" data-v="all" aria-pressed="'+(ui.ship==="all")+'">'+esc(L.all)+'</button>';
    ships.forEach(function(s){ h += '<button type="button" class="chip code" data-act="ship" data-v="'+esc(s)+'" aria-pressed="'+(ui.ship===s)+'">'+esc(s)+'</button>'; });

  if(VIEW.p) h += '<div class="vnote">'+esc(ui.lang==="vi"?("Nội dung theo nhãn QR in ngày "+(VIEW.d||"—")+". Liên hệ Seungkwang International nếu cần thông tin mới nhất."):("QR 라벨 출력일("+(VIEW.d||"—")+") 기준 내용입니다. 최신 내용은 승광인터내셔널에 문의하세요."))+'</div>';
  if(state.example && state.pallets.length){
    h += '<div class="notice"><p>'+esc(L.exNote)+'</p>'+(cap.canEdit?'<button type="button" class="btn" data-act="clearEx">'+esc(L.exClear)+'</button>':'')+'</div>';
  }

  h += '<div class="main'+(sel?' has-sel':'')+'"><nav class="list" aria-label="'+esc(L.pallet)+'">';
  if(!state.pallets.length) h += '<div class="empty">'+esc(L.emptyList)+'</div>';
  else if(!rows.length) h += '<div class="empty">'+esc(L.noMatch)+'</div>';
  rows.forEach(function(r){
    var p=r.p, tt=totals(p);
    h += '<a class="pcard" href="#'+esc(slug(p.code))+'" aria-current="'+(sel===p)+'"><div class="row1"><span class="code">'+esc(p.code)+'</span>'+pill(p.status)+'</div>';
    h += '<div class="meta"><span class="code">'+esc(p.ship||"—")+'</span> · '+esc(p.dest||"")+'</div>';
    if(isSingle(p)) h += '<div class="pname">'+esc(iname(p.item))+(specOf(p.item)?' · '+esc(specOf(p.item)):'')+'</div>';
    h += '<div class="meta num">'+tt.l+' '+esc(L.layers)+' · '+fmt(tt.c)+' '+esc(L.cartons)+' · '+fmt(tt.u)+' pcs</div>';
    h += miniBar(p);
    if(r.hits.length){
      h += '<ul class="hits">';
      r.hits.slice(0,4).forEach(function(x){ h += '<li>'+esc(iname(x))+' · <b class="num">'+fmt(x.c)+' '+esc(L.ctn)+'</b></li>'; });
      if(r.hits.length>4) h += '<li>+'+(r.hits.length-4)+'</li>';
      h += '</ul>';
    }
    h += '</a>';
  });
  h += '</nav>';

  h += '<section class="detail" aria-live="polite">';
  if(sel) h += detail(sel,q);
  else h += '<div class="empty" style="border:0">'+esc(VIEW.err?(ui.lang==="vi"?"Không đọc được mã QR. Hãy quét lại.":"QR 내용을 읽을 수 없습니다. 다시 찍어 주세요."):(ui.lang==="vi"?"Quét nhãn QR trên pallet để xem nội dung.":"팔레트에 붙은 QR 라벨을 휴대폰 카메라로 찍으면 적재 내용이 이 화면에 표시됩니다."))+'</div>';
  h += '</section></div></div>';

  if(ui.modal==="edit") h += editSheet();
  else if(ui.modal==="paste") h += pasteSheet();
  else if(ui.modal==="qr") h += qrSheet(sel);
  else if(ui.modal==="del") h += confirmSheet(L.delQ,"delYes");
  else if(ui.modal==="clear") h += confirmSheet(L.clearQ,"clearYes");

  var focusId = document.activeElement && document.activeElement.id;
  var selStart = focusId && document.activeElement.selectionStart;
  app.innerHTML = h;
  if(focusId){ var el=document.getElementById(focusId); if(el){ el.focus(); try{ if(selStart!=null) el.setSelectionRange(selStart,selStart);}catch(e){} } }
  if(ui.modal==="qr" && sel) drawQR(sel);
  if(ui.flashLayer!=null){
    var ly = document.getElementById("layer-"+ui.flashLayer) || document.getElementById("layer-0");
    if(ly){ ly.classList.add("flash"); ly.scrollIntoView({block:"nearest",behavior:"smooth"}); setTimeout(function(){ ly.classList.remove("flash"); },1200); }
    ui.flashLayer=null;
  }
}

function pill(st){ var L=t(); st = st||"packing"; return '<span class="pill st-'+esc(st)+'">'+esc(L.st[st]||st)+'</span>'; }
function miniBar(p){
  var tot=0, segs={}; var order=[];
  layersOf(p).forEach(function(Ly){ Ly.forEach(function(it){ var k=it.s||it.n; if(!segs[k]){ segs[k]={c:0,col:pcolor(it)}; order.push(k);} segs[k].c+=n0(it.c); tot+=n0(it.c); }); });
  if(!tot) return '';
  return '<div class="mini">'+order.map(function(k){ return '<span style="flex:'+segs[k].c+';background:'+segs[k].col+'"></span>'; }).join("")+'</div>';
}

function detail(p,q){
  var L=t(), tt=totals(p);
  var h='';
  h += '<div class="dhead"><div class="id"><div class="label">'+esc(L.pallet)+'</div><h2>'+esc(p.code)+'</h2><div class="sub"><span class="code">'+esc(p.ship||"—")+'</span> · '+esc(p.dest||"")+' · '+pill(p.status)+'</div></div><div class="dactions">';

  h += '<button type="button" class="btn" data-act="qr">'+icon("qr")+esc(L.qr)+'</button>';
  if(cap.canEdit){
    h += '<button type="button" class="btn" data-act="edit">'+esc(L.edit)+'</button>';
    h += '<button type="button" class="btn ghost" data-act="dup">'+esc(L.dup)+'</button>';
  }

  h += stat(L.cartons, fmt(tt.c), "");
  h += stat(L.units, fmt(tt.u), "pcs");
  h += stat(L.gross, p.gross?fmt(p.gross):"—", p.gross?L.kg:"");
  if(!single) h += stat(L.height, p.height?fmt(p.height):"—", p.height?L.mm:"");
  h += '</dl>';
  h += '<div class="dbody"><div class="stackbox"><h3>'+esc(L.stack)+'</h3><div class="stack">'+stackSVG(p,q)+'</div>';
  if(!single){
    var leg=productsOf(p), seenL={}; leg=leg.filter(function(it){ var k=it.s||it.n; if(seenL[k]) return false; seenL[k]=1; return true; });
    if(leg.length) h += '<ul class="legend">'+leg.map(function(it){ return '<li><i style="background:'+pcolor(it)+'"></i><span>'+esc(iname(it))+(specOf(it)?' · '+esc(specOf(it)):'')+'</span></li>'; }).join("")+'</ul>';
  }
  if(p.note) h += '<div class="note"><b>'+esc(L.note)+'</b>\n'+esc(p.note)+'</div>';

    h += '<dl class="kv">'+kv(L.sku,it.s,1)+kv(L.perCtnLabel,it.u?fmt(it.u)+" pcs":"",0)+kv(L.lot,it.l,1)+kv(L.exp,it.e,1)+kv(L.size,specOf(it),0)+kv(L.height,p.height?fmt(p.height)+" "+L.mm:"",0)+'</dl>';
    h += '<p class="calc num">'+esc(L.calc(fmt(sp.per),sp.full,sp.rem,fmt(tt.c),it.u?fmt(tt.u):"",tt.r?fmt(tt.r):""))+'</p></div>';
    h += '<div class="layer"><div class="tscroll"><table><thead><tr><th>'+esc(L.layers)+'</th><th class="r">'+esc(L.ctn)+'</th><th class="r">'+esc(L.qty)+'</th></tr></thead><tbody>';
    if(tt.r) h += '<tr id="layer-rem"><td>'+esc(L.remnantShort)+' · '+esc(L.top)+'</td><td class="r num">1</td><td class="r num">'+fmt(tt.r)+'</td></tr>';
    if(sp.rem) h += '<tr id="layer-'+sp.full+'"><td>'+esc(L.layerN(sp.full+1))+' · '+esc(L.top)+'</td><td class="r num">'+fmt(sp.rem)+'</td><td class="r num">'+(it.u?fmt(sp.rem*n0(it.u)):"—")+'</td></tr>';
    if(sp.full) h += '<tr id="layer-0"><td>'+esc(L.layerRange(1,sp.full))+'</td><td class="r num">'+fmt(sp.per)+' × '+sp.full+'</td><td class="r num">'+(it.u?fmt(sp.per*sp.full*n0(it.u)):"—")+'</td></tr>';
    h += '</tbody></table></div></div></div></div>';

  h += '<h3>'+esc(L.sheet)+'</h3>';
  var n=(p.layers||[]).length;

    var Ly=p.layers[i], lc=0, lu=0;

function nextCode(code){

}
function saveDraft(){
  var L=t(), d=clone(ui.draft);
  d.code=String(d.code||"").trim();
  if(!d.code){ ui.err=L.needCode; render(); return; }
  if(d.code!==ui.draftOrig && findP(d.code)){ ui.err=L.dupCode; render(); return; }
  ["ship","dest","size","note"].forEach(function(k){ d[k]=String(d[k]||"").trim(); });
  d.gross = d.gross===""?"":n0(d.gross); d.height = d.height===""?"":n0(d.height);
  if(d.mode!=="mixed"){
    var it=d.item||{};
    d.item={n:String(it.n||"").trim(),s:String(it.s||"").trim(),q:String(it.q==null?"":it.q).trim(),qu:it.qu==="g"?"g":"ml",u:String(it.u||"").trim()===""?"":n0(it.u),l:String(it.l||"").trim(),e:String(it.e||"").trim()}; var rr1=Math.floor(n0(it.r)); if(rr1>0) d.item.r=rr1; if(!d.item.q){ delete d.item.q; delete d.item.qu; }

    if(!d.item.n || !(d.total>0)){ ui.err=L.needItem; render(); return; }
    delete d.mode; delete d.layers;
  } else {
  delete d.item; delete d.total; delete d.per;
  d.layers = d.layers.map(function(Ly){ return Ly.filter(function(it){ return (it.n||it.v||it.s||"").trim(); }).map(function(it){ return {n:it.n.trim(),v:(it.v||"").trim(),s:(it.s||"").trim(),c:n0(it.c),u:it.u===""?"":n0(it.u),l:(it.l||"").trim(),e:(it.e||"").trim(),q:String(it.q==null?"":it.q).trim(),qu:it.qu==="g"?"g":"ml"}; }).map(function(it){ if(!it.q){ delete it.q; delete it.qu; } return it; }); });
  while(d.layers.length && !d.layers[d.layers.length-1].length) d.layers.pop();
  }

}
